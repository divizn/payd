services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payd
      POSTGRES_PASSWORD: payd
      POSTGRES_DB: payd
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payd -d payd"]
      interval: 2s
      timeout: 2s
      retries: 15

  payd:
    build: .
    environment:
      DATABASE_URL: postgres://payd:payd@postgres:5432/payd?sslmode=disable&pool_max_conns=${PAYD_POOL_MAX_CONNS:-32}
      ACQUIRER_LATENCY: ${ACQUIRER_LATENCY:-0s}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - payd
